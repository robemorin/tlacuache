    <script>
        // Exact fraction class for math solvers
        function gcd(a, b) {
            return b ? gcd(b, a % b) : Math.abs(a);
        }

        class Fraction {
            constructor(num, den = 1) {
                if (den < 0) {
                    num = -num;
                    den = -den;
                }
                let g = gcd(num, den);
                this.num = g === 0 ? 0 : num / g;
                this.den = g === 0 ? 1 : den / g;
            }
            add(o) { return new Fraction(this.num * o.den + o.num * this.den, this.den * o.den); }
            sub(o) { return new Fraction(this.num * o.den - o.num * this.den, this.den * o.den); }
            mul(o) { return new Fraction(this.num * o.num, this.den * o.den); }
            div(o) { return new Fraction(this.num * o.den, this.den * o.num); }
            neg() { return new Fraction(-this.num, this.den); }
            isZero() { return this.num === 0; }
            toString() {
                if (this.den === 1) return this.num.toString();
                return `${this.num}/${this.den}`;
            }
            toLatex() {
                if (this.den === 1) return this.num.toString();
                return `\\frac{${this.num}}{${this.den}}`;
            }
        }

        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        generateExams();
                        return MathJax.typesetPromise();
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        // --- Core Math Solver Engine ---

        // Calculate Determinant
        function getDeterminant(matrix) {
            let n = matrix.length;
            if (n === 1) return matrix[0][0];
            if (n === 2) return matrix[0][0] * matrix[1][1] - matrix[0][1] * matrix[1][0];
            let det = 0;
            for (let j = 0; j < n; j++) {
                let sub = [];
                for (let i = 1; i < n; i++) {
                    sub.push(matrix[i].filter((_, colIdx) => colIdx !== j));
                }
                let sign = (j % 2 === 0) ? 1 : -1;
                det += sign * matrix[0][j] * getDeterminant(sub);
            }
            return det;
        }

        // Reduced Row Echelon Form (RREF) solver using Fraction class
        function rref(matrix) {
            let R = matrix.map(row => row.map(val => new Fraction(val)));
            let rows = R.length;
            let cols = R[0].length;
            let lead = 0;
            let pivots = [];
            for (let r = 0; r < rows; r++) {
                if (lead >= cols) break;
                let i = r;
                while (R[i][lead].isZero()) {
                    i++;
                    if (i === rows) {
                        i = r;
                        lead++;
                        if (lead === cols) return { R, pivots };
                    }
                }
                if (i !== r) {
                    let temp = R[i];
                    R[i] = R[r];
                    R[r] = temp;
                }
                let lv = R[r][lead];
                R[r] = R[r].map(val => val.div(lv));
                for (let i = 0; i < rows; i++) {
                    if (i !== r) {
                        let lv2 = R[i][lead];
                        R[i] = R[i].map((val, idx) => val.sub(lv2.mul(R[r][idx])));
                    }
                }
                pivots.push(lead);
                lead++;
            }
            return { R, pivots };
        }

        // Helper to generate matrix with values from min to max
        function generateMatrix(rows, cols, min = -10, max = 10) {
            let matrix = [];
            for (let i = 0; i < rows; i++) {
                let row = [];
                for (let j = 0; j < cols; j++) {
                    row.push(Math.floor(Math.random() * (max - min + 1)) + min);
                }
                matrix.push(row);
            }
            return matrix;
        }

        // Helper to format matrix/vector in MathJax
        function formatMatrixMathJax(matrix, name = "") {
            let rows = matrix.map(row => row.join(" & "));
            let prefix = name ? name + " = " : "";
            return prefix + "\\begin{bmatrix} " + rows.join(" \\\\ ") + " \\end{bmatrix}";
        }

        function formatVectorLatex(v) {
            let rowStrs = v.map(x => (x instanceof Fraction) ? x.toLatex() : x.toString());
            return "\\begin{bmatrix} " + rowStrs.join(" \\\\ ") + " \\end{bmatrix}";
        }

        // Dot product
        function dotProductFraction(u, v) {
            let sum = new Fraction(0);
            for (let i = 0; i < u.length; i++) {
                sum = sum.add(u[i].mul(v[i]));
            }
            return sum;
        }

        // Gram-Schmidt for column vectors (Rational version)
        function gramSchmidtRational(vectors) {
            let n = vectors[0].length;
            let u = [];
            for (let i = 0; i < vectors.length; i++) {
                let v = vectors[i].map(x => new Fraction(x));
                let projSum = new Array(n).fill(0).map(() => new Fraction(0));
                
                for (let j = 0; j < i; j++) {
                    let uj = u[j];
                    let num = dotProductFraction(v, uj);
                    let den = dotProductFraction(uj, uj);
                    if (!den.isZero()) {
                        let coeff = num.div(den);
                        for (let d = 0; d < n; d++) {
                            projSum[d] = projSum[d].add(coeff.mul(uj[d]));
                        }
                    }
                }
                
                let ui = [];
                for (let d = 0; d < n; d++) {
                    ui.push(v[d].sub(projSum[d]));
                }
                
                let isZero = ui.every(x => x.isZero());
                if (!isZero) {
                    u.push(ui);
                }
            }
            return u;
        }

        // --- Problems Generator Functions ---

        // 1. Operaciones básicas + Inversa (A, B, C de 3x3; alfa escalar)
        function getProblem1() {
            let A, det;
            let ok = false;
            while (!ok) {
                A = generateMatrix(3, 3, -3, 3);
                det = getDeterminant(A);
                // nice inverse
                if (det !== 0 && Math.abs(det) <= 2) {
                    ok = true;
                }
            }

            let B = generateMatrix(3, 3, -4, 4);
            let C = generateMatrix(3, 3, -4, 4);
            let alpha = Math.floor(Math.random() * 5) - 2; // -2 to 2 except 0
            if (alpha === 0) alpha = 2;

            // Solver
            let augmented = [];
            for (let i = 0; i < 3; i++) {
                let row = [...A[i], 0, 0, 0];
                row[3 + i] = 1;
                augmented.push(row);
            }
            let { R } = rref(augmented);
            let A_inv = [];
            for (let i = 0; i < 3; i++) {
                let row = [];
                for (let j = 0; j < 3; j++) {
                    row.push(R[i][3 + j]);
                }
                A_inv.push(row);
            }

            // B + C
            let BplusC = [];
            for (let i = 0; i < 3; i++) {
                let row = [];
                for (let j = 0; j < 3; j++) {
                    row.push(B[i][j] + C[i][j]);
                }
                BplusC.push(row);
            }

            // B + alpha * C
            let B_alpha_C = [];
            for (let i = 0; i < 3; i++) {
                let row = [];
                for (let j = 0; j < 3; j++) {
                    row.push(new Fraction(B[i][j] + alpha * C[i][j]));
                }
                B_alpha_C.push(row);
            }

            // A_inv * (B + alpha * C)
            let finalMult = [];
            for (let i = 0; i < 3; i++) {
                let row = [];
                for (let j = 0; j < 3; j++) {
                    let sum = new Fraction(0);
                    for (let l = 0; l < 3; l++) {
                        sum = sum.add(A_inv[i][l].mul(B_alpha_C[l][j]));
                    }
                    row.push(sum);
                }
                finalMult.push(row);
            }

            let A_inv_latex = "\\begin{bmatrix} " + A_inv.map(row => row.map(f => f.toLatex()).join(" & ")).join(" \\\\ ") + " \\end{bmatrix}";
            let finalMult_latex = "\\begin{bmatrix} " + finalMult.map(row => row.map(f => f.toLatex()).join(" & ")).join(" \\\\ ") + " \\end{bmatrix}";

            return {
                text: `Dadas las siguientes matrices $A$, $B$, $C$ y el escalar $\\alpha = ${alpha}$, calcula las operaciones indicadas:`,
                latex: "\\[ " + formatMatrixMathJax(A, "A") + ", \\quad " + formatMatrixMathJax(B, "B") + ", \\quad " + formatMatrixMathJax(C, "C") + " \\]",
                subQuestions: [
                    "La matriz inversa $A^{-1}$ (por Gauss-Jordan o adjunta).",
                    "La suma de matrices $B + C$.",
                    "La operación de producto matricial $A^{-1}(B + \\alpha C)$."
                ],
                answer: `a) $A^{-1} = ${A_inv_latex}$, b) $B+C = ${formatMatrixMathJax(BplusC)}$, c) $A^{-1}(B+${alpha}C) = ${finalMult_latex}$`
            };
        }

        // 2. Producto punto, producto cruz y ángulo entre vectores (3x1)
        function getProblem2() {
            let u = [];
            let v = [];
            for (let i = 0; i < 3; i++) {
                u.push(Math.floor(Math.random() * 11) - 5); // -5 to 5
                v.push(Math.floor(Math.random() * 11) - 5);
            }
            let dot = u[0]*v[0] + u[1]*v[1] + u[2]*v[2];
            let cross = [
                u[1]*v[2] - u[2]*v[1],
                u[2]*v[0] - u[0]*v[2],
                u[0]*v[1] - u[1]*v[0]
            ];
            let normU = Math.sqrt(u[0]*u[0] + u[1]*u[1] + u[2]*u[2]);
            let normV = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
            let cosTh = (normU * normV > 0) ? dot / (normU * normV) : 0;
            let theta = Math.acos(Math.max(-1, Math.min(1, cosTh))) * 180 / Math.PI;

            let uFormatted = "\\vec{u} = \\begin{bmatrix} " + u.join(" \\\\ ") + " \\end{bmatrix}";
            let vFormatted = "\\vec{v} = \\begin{bmatrix} " + v.join(" \\\\ ") + " \\end{bmatrix}";

            return {
                text: "Para los siguientes vectores columna, determina:",
                latex: "\\[ " + uFormatted + ", \\quad " + vFormatted + " \\]",
                subQuestions: [
                    "El producto punto $\\vec{u} \\cdot \\vec{v}$.",
                    "El producto cruz $\\vec{u} \\times \\vec{v}$.",
                    "El ángulo $\\theta$ en grados sexagesimales entre ambos vectores."
                ],
                answer: `a) $\\vec{u} \\cdot \\vec{v} = ${dot}$, b) $\\vec{u} \\times \\vec{v} = \\begin{bmatrix} ${cross.join(" \\\\ ")} \\end{bmatrix}$, c) $\\cos(\\theta) = ${cosTh.toFixed(4)} \\implies \\theta \\approx ${theta.toFixed(2)}^\\circ$`
            };
        }

        // 3. Espacio Columna, Espacio Nulo, Gram-Schmidt en R⁴ (A de 4x3 con rango 2, y vector [P]_A)
        function getProblem3() {
            let A = [];
            let ok = false;
            let c1, c2, c3;
            while (!ok) {
                c1 = [Math.floor(Math.random() * 4) - 1, Math.floor(Math.random() * 4) - 1, 1, 0];
                c2 = [0, Math.floor(Math.random() * 4) - 1, Math.floor(Math.random() * 4) - 1, 1];
                // Linear combination to guarantee rank 2
                c3 = c1.map((val, idx) => val + c2[idx]); // c3 = c1 + c2
                
                A = [
                    [c1[0], c2[0], c3[0]],
                    [c1[1], c2[1], c3[1]],
                    [c1[2], c2[2], c3[2]],
                    [c1[3], c2[3], c3[3]]
                ];

                // Check rank
                let { pivots } = rref(A);
                if (pivots.length === 2) {
                    ok = true;
                }
            }

            // [P]_A coordinate vector (3x1)
            let P_A = [
                Math.floor(Math.random() * 4) - 1, // -1 to 2
                Math.floor(Math.random() * 4) - 1,
                Math.floor(Math.random() * 4) - 1
            ];
            // avoid zero vector
            if (P_A.every(x => x === 0)) P_A = [1, 2, 0];

            // a) [P]_C = A * [P]_A
            let P_C = [];
            for (let i = 0; i < 4; i++) {
                P_C.push(A[i][0] * P_A[0] + A[i][1] * P_A[1] + A[i][2] * P_A[2]);
            }

            // b) Gram-Schmidt on pivot columns (c1, c2)
            let B = [c1, c2];
            let u_vectors = gramSchmidtRational(B); // [u1, u2] where u1, u2 are 4D vectors of Fraction

            // d) Change of base of [P]_C into B' = {u1, u2}
            // k_i = (P_C . u_i) / (u_i . u_i)
            let k = [];
            for (let i = 0; i < 2; i++) {
                let ui = u_vectors[i];
                let num = new Fraction(0);
                let den = new Fraction(0);
                for (let d = 0; d < 4; d++) {
                    let pc_val = new Fraction(P_C[d]);
                    num = num.add(pc_val.mul(ui[d]));
                    den = den.add(ui[d].mul(ui[d]));
                }
                k.push(num.div(den));
            }

            // e) Verification: k1 * u1 + k2 * u2 should equal P_C
            let verifyText = `(${k[0].toLatex()})${formatVectorLatex(u_vectors[0])} + (${k[1].toLatex()})${formatVectorLatex(u_vectors[1])}`;

            let A_latex = formatMatrixMathJax(A, "A");
            let PA_latex = formatVectorLatex(P_A);

            return {
                text: `Dada la matriz de $4 \\times 3$ $A$ (de rango 2) y el vector de coordenadas $[P]_A$:`,
                latex: `\\[ ${A_latex}, \\quad [P]_A = ${PA_latex} \\]`,
                subQuestions: [
                    "Calcula $[P]_C$, es decir, el vector $P$ representado en la base canónica.",
                    "Encuentra una base ortogonal $B' = \\{u_1, u_2\\}$ para el espacio columna de $A$ aplicando Gram-Schmidt a las columnas base.",
                    "Calcula el cambio de base del vector $[P]_C$ expresándolo en la nueva base ortogonal ($[P]_{B'}$).",
                    "Comprueba tu respuesta verificando la combinación lineal $[P]_C = k_1 u_1 + k_2 u_2$."
                ],
                answer: `a) $[P]_C = ${formatVectorLatex(P_C)}$, b) Base Ortogonal $B'$: $u_1 = ${formatVectorLatex(u_vectors[0])}, u_2 = ${formatVectorLatex(u_vectors[1])}$, c) $[P]_{B'} = \\begin{bmatrix} ${k[0].toLatex()} \\\\ ${k[1].toLatex()} \\end{bmatrix}$, d) Comprobación: $${verifyText} = ${formatVectorLatex(P_C)}$`
            };
        }

        // 4. Matriz de rotación
        function getProblem4() {
            let niceAngles = [30, 45, 60, 120, 135, 150, 240, 270, 300, 315];
            let angle = niceAngles[Math.floor(Math.random() * niceAngles.length)];
            let rad = angle * Math.PI / 180;
            let cos = Math.cos(rad);
            let sin = Math.sin(rad);

            let R_latex = `\\begin{bmatrix} \\cos(${angle}^\\circ) & -\\sin(${angle}^\\circ) \\\\ \\sin(${angle}^\\circ) & \\cos(${angle}^\\circ) \\end{bmatrix} \\approx \\begin{bmatrix} ${cos.toFixed(4)} & ${(-sin).toFixed(4)} \\\\ ${sin.toFixed(4)} & ${cos.toFixed(4)} \\end{bmatrix}`;
            let R_inv_latex = `\\begin{bmatrix} \\cos(${angle}^\\circ) & \\sin(${angle}^\\circ) \\\\ -\\sin(${angle}^\\circ) & \\cos(${angle}^\\circ) \\end{bmatrix} \\approx \\begin{bmatrix} ${cos.toFixed(4)} & ${sin.toFixed(4)} \\\\ ${(-sin).toFixed(4)} & ${cos.toFixed(4)} \\end{bmatrix}`;

            return {
                text: `Dada una rotación de $\\theta = ${angle}^\\circ$ en sentido antihorario en $\\mathbb{R}^2$:`,
                subQuestions: [
                    "Calcula la matriz de rotación $R$.",
                    "Calcula la matriz de rotación inversa $R^{-1}$ (o $R^T$)."
                ],
                answer: `a) $R = ${R_latex}$, b) $R^{-1} = ${R_inv_latex}$`
            };
        }

        // Complex Number Generator Helper
        function generateComplex() {
            let re = Math.floor(Math.random() * 7) - 3; // -3 to 3
            let im = Math.floor(Math.random() * 7) - 3;
            if (im === 0) im = 2;
            if (re === 0) re = 1;
            return { re, im };
        }

        function formatComplexMathJax(z) {
            let sign = z.im >= 0 ? "+" : "";
            return `${z.re}${sign}${z.im}i`;
        }

        // 5. Números complejos (operaciones y Euler)
        function getProblem5() {
            // a) Two complex numbers
            let z1 = generateComplex();
            let z2 = generateComplex();
            // z1 + z2
            let sum_re = z1.re + z2.re, sum_im = z1.im + z2.im;
            let sum_sign = sum_im >= 0 ? "+" : "";
            // z1 / z2
            let den = z2.re*z2.re + z2.im*z2.im;
            let q_re = new Fraction(z1.re*z2.re + z1.im*z2.im, den);
            let q_im = new Fraction(z1.im*z2.re - z1.re*z2.im, den);
            let q_sign = q_im.num >= 0 ? "+" : "-";
            let q_im_abs = new Fraction(Math.abs(q_im.num), q_im.den);

            // b) 5 numbers in different quadrants and +-90 degrees
            // Q1, Q2, Q3, Q4, Pure Imaginary
            let listEuler = [
                { re: 3, im: 3, label: "w_1 = 3 + 3i" }, // Q1: 45 deg
                { re: -2, im: 2, label: "w_2 = -2 + 2i" }, // Q2: 135 deg
                { re: -3, im: -3*Math.sqrt(3), label: "w_3 = -3 - 3\\sqrt{3}i" }, // Q3: 240 deg (or decimal -3 - 5.2i)
                { re: 4, im: -4, label: "w_4 = 4 - 4i" }, // Q4: 315 deg (or -45 deg)
                { re: 0, im: -5, label: "w_5 = -5i" } // Pure imaginary: -90 deg
            ];
            // Calculate Euler forms
            let answersEuler = [];
            listEuler.forEach((item, index) => {
                let r = Math.sqrt(item.re*item.re + item.im*item.im);
                let angleRad = Math.atan2(item.im, item.re);
                let angleDeg = angleRad * 180 / Math.PI;
                if (angleDeg < 0) angleDeg += 360; // express nicely in 0-360
                answersEuler.push(`$w_{${index+1}} = ${r.toFixed(2)} e^{i ${angleDeg.toFixed(1)}^\\circ} \\approx ${r.toFixed(2)} e^{i ${angleRad.toFixed(3)}\\text{ rad}}$`);
            });

            // c) 2 numbers in Euler to Cartesian
            let toCart = [
                { exp: "4 e^{i 60^\\circ}", ans: "2 + 2\\sqrt{3}i \\approx 2 + 3.464i" },
                { exp: "2 e^{-i 45^\\circ}", ans: "\\sqrt{2} - \\sqrt{2}i \\approx 1.414 - 1.414i" }
            ];

            let q1_latex = `z_1 = ${formatComplexMathJax(z1)}, \\quad z_2 = ${formatComplexMathJax(z2)}`;

            return {
                text: "Resuelve los siguientes planteamientos de números complejos:",
                subQuestions: [
                    `Dada la forma cartesiana de $z_1$ y $z_2$, calcula $z_1 + z_2$ y $\\frac{z_1}{z_2}$ para: $${q1_latex}$.`,
                    `Convierte a su <strong>forma exponencial o de Euler</strong> ($r e^{i \\theta}$) los siguientes números: $${listEuler.map(x => x.label).join(",\\quad ")}$.`,
                    `Convierte a su <strong>forma cartesiana</strong> ($a + bi$) los siguientes números: $u_1 = ${toCart[0].exp},\\quad u_2 = ${toCart[1].exp}$`
                ],
                answer: `a) Suma: $${sum_re}${sum_sign}${sum_im}i$, División: $${q_re.toLatex()} ${q_sign} ${q_im_abs.toLatex()}i$,<br>
                         b) Exponencial: ${answersEuler.join(", ")},<br>
                         c) Cartesiana: $u_1 = ${toCart[0].ans}$, $u_2 = ${toCart[1].ans}$`
            };
        }

        // --- Master Generator ---

        function generateExams() {
            const countInput = document.getElementById('examCount');
            const numExams = parseInt(countInput.value) || 1;
            const container = document.getElementById('examsContainer');
            container.innerHTML = '';

            let answerSheetHtml = `
                <div class="answers-sheet">
                    <h2>Clave de Respuestas (Ajustada)</h2>
            `;

            for (let examIndex = 1; examIndex <= numExams; examIndex++) {
                const examCode = "AL-AJUS-" + examIndex;
                const sheet = document.createElement('div');
                sheet.className = 'exam-sheet';

                // Generate specific problems
                const p1 = getProblem1();
                const p2 = getProblem2();
                const p3 = getProblem3();
                const p4 = getProblem4();
                const p5 = getProblem5();

                let html = `
                    <div class="exam-header">
                        <img src="http://www.uadec.mx/wp-content/uploads/2019/01/EscudoUAdeC-C.png" alt="Escudo UAdeC">
                        <div class="exam-header-text">
                            <h1>Universidad Autónoma de Coahuila</h1>
                            <h2>FIME Monclova</h2>
                            <h3>Álgebra Lineal &bull; Docente: MC. Roberto Morin</h3>
                        </div>
                    </div>
                    <div class="student-info">
                        <div class="info-field">Nombre del Alumno:<span></span></div>
                        <div class="info-field">Matrícula:<span></span></div>
                        <div class="info-field">Fecha:<span></span></div>
                    </div>
                    <div class="exam-body">
                        <h2>Examen de Álgebra Lineal <span class="exam-code">Clave: ${examCode}</span></h2>
                        <div class="instructions">
                            <strong>Instrucciones:</strong> Resuelve cada uno de los siguientes problemas de manera presencial a mano. Detalla todo el procedimiento y justificaciones operacionales en tu hoja de respuestas de manera ordenada. No se permite el uso de computadora o graficadores.
                        </div>
                        <ul class="questions-list">
                `;

                // Render questions with weights
                const render = (p, weights) => {
                    let qHtml = `<li class="question-item">
                        <div class="question-text">${p.text}</div>
                        ${p.latex ? `<div class="matrix-display-container">${p.latex}</div>` : ""}
                        <ol class="sub-questions">`;
                    p.subQuestions.forEach((sq, idx) => {
                        qHtml += `<li>
                            <div style="float: right; font-weight: bold; font-family: monospace; color: #475569;">[${weights[idx]}]</div>
                            ${sq}
                        </li>`;
                    });
                    qHtml += `</ol></li>`;
                    return qHtml;
                };

                html += render(p1, [12, 4, 9]);
                html += render(p2, [4, 6, 5]);
                html += render(p3, [5, 12, 8, 5]);
                html += render(p4, [5, 5]);
                html += render(p5, [6, 10, 4]);

                html += `
                        </ul>
                    </div>
                `;

                sheet.innerHTML = html;
                container.appendChild(sheet);

                // Add to answers key
                answerSheetHtml += `
                    <div class="exam-answer-block">
                        <h3>Examen Clave: ${examCode}</h3>
                        <div class="answer-item"><strong>1. Operaciones + Inversa:</strong> ${p1.answer}</div>
                        <div class="answer-item"><strong>2. Vectores R³:</strong> ${p2.answer}</div>
                        <div class="answer-item"><strong>3. Espacios & GS:</strong> ${p3.answer}</div>
                        <div class="answer-item"><strong>4. Rotaciones:</strong> ${p4.answer}</div>
                        <div class="answer-item"><strong>5. Complejos:</strong> ${p5.answer}</div>
                    </div>
                `;
            }

            answerSheetHtml += `</div>`;
            container.innerHTML += answerSheetHtml;

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        function printPDF() {
            window.print();
        }
    </script>
</head>
<body>
    <div class="control-panel">
        <div class="brand">
            <h1>Generador de Exámenes de Álgebra Lineal</h1>
            <p>FIME Monclova &bull; Ajustes de reactivos y rúbrica para examen presencial a mano</p>
        </div>
        <div class="controls">
            <div class="input-group">
                <label for="examCount">Cantidad</label>
                <input type="number" id="examCount" min="1" max="100" value="5">
            </div>
            <button class="btn" onclick="generateExams()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Generar Ajustados
            </button>
            <button class="btn btn-success" onclick="printPDF()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Imprimir / Guardar PDF
            </button>
        </div>
    </div>

    <div class="exams-container" id="examsContainer">
        <!-- Cargando exámenes... -->
    </div>
</body>
