    <script>
        // Exact fraction class for math solvers
        function gcd(a, b) {
            return b ? gcd(b, a % b) : Math.abs(a);
        }

        class Fraction {
            constructor(num, den = 1) {
                if (den < 0) {
                    num = -num;
                    den = -den;
                }
                let g = gcd(num, den);
                this.num = g === 0 ? 0 : num / g;
                this.den = g === 0 ? 1 : den / g;
            }
            add(o) { return new Fraction(this.num * o.den + o.num * this.den, this.den * o.den); }
            sub(o) { return new Fraction(this.num * o.den - o.num * this.den, this.den * o.den); }
            mul(o) { return new Fraction(this.num * o.num, this.den * o.den); }
            div(o) { return new Fraction(this.num * o.den, this.den * o.num); }
            neg() { return new Fraction(-this.num, this.den); }
            isZero() { return this.num === 0; }
            toString() {
                if (this.den === 1) return this.num.toString();
                return `${this.num}/${this.den}`;
            }
            toLatex() {
                if (this.den === 1) return this.num.toString();
                return `\\frac{${this.num}}{${this.den}}`;
            }
        }

        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        generateExams();
                        return MathJax.typesetPromise();
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        // --- Math Solver Functions for Part 2 ---

        // Dot product of vectors
        function dotProduct(u, v) {
            return u.reduce((sum, val, idx) => sum + val * v[idx], 0);
        }

        // Apply Gram-Schmidt in Rational Fractions
        function gramSchmidtRational(vectors) {
            let n = vectors[0].length;
            let u = [];
            for (let i = 0; i < vectors.length; i++) {
                let v = vectors[i].map(x => new Fraction(x));
                let projSum = new Array(n).fill(0).map(() => new Fraction(0));
                
                for (let j = 0; j < i; j++) {
                    let uj = u[j];
                    // dot(v, uj)
                    let num = new Fraction(0);
                    let den = new Fraction(0);
                    for (let d = 0; d < n; d++) {
                        num = num.add(v[d].mul(uj[d]));
                        den = den.add(uj[d].mul(uj[d]));
                    }
                    if (!den.isZero()) {
                        let coeff = num.div(den);
                        for (let d = 0; d < n; d++) {
                            projSum[d] = projSum[d].add(coeff.mul(uj[d]));
                        }
                    }
                }
                
                let ui = [];
                for (let d = 0; d < n; d++) {
                    ui.push(v[d].sub(projSum[d]));
                }
                
                // If ui is not the zero vector, keep it
                let isZero = ui.every(x => x.isZero());
                if (!isZero) {
                    u.push(ui);
                }
            }
            return u;
        }

        // Format rational vector to latex
        function formatVectorLatex(v) {
            let rowStrs = v.map(x => (x instanceof Fraction) ? x.toLatex() : x.toString());
            return "\\begin{bmatrix} " + rowStrs.join(" \\\\ ") + " \\end{bmatrix}";
        }

        // Helper to format matrix
        function formatMatrixMathJax(matrix, name = "") {
            let rows = matrix.map(row => row.join(" & "));
            let prefix = name ? name + " = " : "";
            return prefix + "\\begin{bmatrix} " + rows.join(" \\\\ ") + " \\end{bmatrix}";
        }

        // Ficha 6: Gram-Schmidt de 3x3
        function getGramSchmidtProblem() {
            let vectors;
            let ok = false;
            // Generate vectors that don't immediately simplify into horrible fractions
            while (!ok) {
                vectors = [];
                for (let i = 0; i < 3; i++) {
                    let vec = [];
                    for (let j = 0; j < 3; j++) {
                        vec.push(Math.floor(Math.random() * 5) - 2); // -2 to 2
                    }
                    vectors.push(vec);
                }
                // Verify they are LI
                let u = gramSchmidtRational(vectors);
                if (u.length === 3) {
                    ok = true;
                }
            }

            let u = gramSchmidtRational(vectors);
            let A = [
                [vectors[0][0], vectors[1][0], vectors[2][0]],
                [vectors[0][1], vectors[1][1], vectors[2][1]],
                [vectors[0][2], vectors[1][2], vectors[2][2]]
            ];

            let ansText = u.map((vec, idx) => `u_{${idx+1}} = ${formatVectorLatex(vec)}`).join(", ");

            return {
                text: "Aplica el proceso de ortogonalización de Gram-Schmidt a las columnas de la siguiente matriz $A$ para obtener una base ortogonal $B' = \\{u_1, u_2, u_3\\}$.",
                latex: "\\[ " + formatMatrixMathJax(A, "A") + " \\]",
                answer: `Vectores ortogonales: $${ansText}$`
            };
        }

        // Ficha 7: Cambio de Base
        function getChangeOfBasisProblem() {
            let v1, v2, v3;
            let ok = false;
            while (!ok) {
                v1 = [Math.floor(Math.random() * 3) - 1, Math.floor(Math.random() * 3) + 1, 0];
                v2 = [Math.floor(Math.random() * 3) - 1, 0, Math.floor(Math.random() * 3) + 1];
                v3 = [0, Math.floor(Math.random() * 3) - 1, Math.floor(Math.random() * 3) + 1];
                // Check independent
                let u = gramSchmidtRational([v1, v2, v3]);
                if (u.length === 3) ok = true;
            }

            let coordB = [
                Math.floor(Math.random() * 5) - 2, // -2 to 2
                Math.floor(Math.random() * 5) - 2,
                Math.floor(Math.random() * 5) - 2
            ];
            if (coordB.every(x => x === 0)) coordB[0] = 2;

            // P_C = c1*v1 + c2*v2 + c3*v3
            let P_C = [
                coordB[0]*v1[0] + coordB[1]*v2[0] + coordB[2]*v3[0],
                coordB[0]*v1[1] + coordB[1]*v2[1] + coordB[2]*v3[1],
                coordB[0]*v1[2] + coordB[1]*v2[2] + coordB[2]*v3[2]
            ];

            // Gram-Schmidt vectors for B'
            let u = gramSchmidtRational([v1, v2, v3]);

            // [P]_B' using projections: c_i = (P_C . u_i) / (u_i . u_i)
            let coordBPrime = [];
            for (let i = 0; i < 3; i++) {
                let ui = u[i];
                let num = new Fraction(0);
                let den = new Fraction(0);
                for (let d = 0; d < 3; d++) {
                    let pc_frac = new Fraction(P_C[d]);
                    num = num.add(pc_frac.mul(ui[d]));
                    den = den.add(ui[d].mul(ui[d]));
                }
                coordBPrime.push(num.div(den));
            }

            let v1Str = formatVectorLatex(v1);
            let v2Str = formatVectorLatex(v2);
            let v3Str = formatVectorLatex(v3);
            let pbStr = formatVectorLatex(coordB);

            let ansPc = formatVectorLatex(P_C);
            let ansBp = u.map((vec, idx) => `u_{${idx+1}} = ${formatVectorLatex(vec)}`).join(", ");
            let ansPbp = formatVectorLatex(coordBPrime);

            return {
                text: "Dada la base original $B = \\{v_1, v_2, v_3\\}$ de $\\mathbb{R}^3$ y el punto $P$ cuyas coordenadas en esa base son $[P]_B$, resuelve:<br>&nbsp;&nbsp;&nbsp;&nbsp;a) Obtén el punto en coordenadas canónicas ($[P]_C$).<br>&nbsp;&nbsp;&nbsp;&nbsp;b) Obtén una base ortogonal $B' = \\{u_1, u_2, u_3\\}$ aplicando Gram-Schmidt a $B$.<br>&nbsp;&nbsp;&nbsp;&nbsp;c) Calcula las coordenadas de $P$ en la nueva base ortogonal ($[P]_{B'}$).",
                latex: `\\[ B = \\left\\{ ${v1Str}, ${v2Str}, ${v3Str} \\right\\}, \\quad [P]_B = ${pbStr} \\]`,
                answer: `a) $[P]_C = ${ansPc}$, b) $B'$: $${ansBp}$, c) $[P]_{B'} = ${ansPbp}$`
            };
        }

        // Ficha 8: Valores y Vectores Propios
        function getEigenvaluesProblem() {
            // Generate matrix with predefined eigenvalues
            // A = P * D * P^-1
            // P = [[1, 1], [1, 2]] / 3x3 equivalent
            // Let's generate a 3x3 upper/lower triangular or diagonalizable matrix with nice eigenvalues
            let l1 = Math.floor(Math.random() * 5) - 2; // -2 to 2
            let l2 = Math.floor(Math.random() * 5) - 2;
            let l3 = Math.floor(Math.random() * 5) - 2;
            if (l1 === l2) l2 += 2;
            if (l2 === l3) l3 -= 2;

            // Pre-diagonalized matrix math:
            // A = P*D*P^-1 using P = [[1, 0, 1], [0, 1, 1], [1, 1, 1]]
            let a = l3;
            let b = -l1 + l3;
            let c = l1 - l3;
            
            let d = -l2 + l3;
            let e = l3;
            let f = l2 - l3;
            
            let g = -l2 + l3;
            let h = -l1 + l3;
            let i = l1 + l2 - l3;

            let A = [
                [a, b, c],
                [d, e, f],
                [g, h, i]
            ];

            // Characterisic polynomial: (lambda - l1)(lambda - l2)(lambda - l3)
            // = lambda^3 - (l1+l2+l3)lambda^2 + (l1*l2+l2*l3+l3*l1)lambda - l1*l2*l3
            let sum_l = l1 + l2 + l3;
            let prod_sum_l = l1*l2 + l2*l3 + l3*l1;
            let det_l = l1*l2*l3;

            let sign1 = sum_l >= 0 ? "-" : "+";
            let val1 = Math.abs(sum_l) === 1 ? "" : Math.abs(sum_l);
            let term1 = sum_l === 0 ? "" : `${sign1} ${val1}\\lambda^2`;

            let sign2 = prod_sum_l >= 0 ? "+" : "-";
            let val2 = Math.abs(prod_sum_l) === 1 ? "" : Math.abs(prod_sum_l);
            let term2 = prod_sum_l === 0 ? "" : `${sign2} ${val2}\\lambda`;

            let sign3 = det_l >= 0 ? "-" : "+";
            let term3 = det_l === 0 ? "" : `${sign3} ${Math.abs(det_l)}`;

            let polyStr = `\\lambda^3 ${term1} ${term2} ${term3}`;

            // P matrix columns are the eigenvectors corresponding to [l1, l2, l3]
            // v1 = [1, 0, 1]^T, v2 = [0, 1, 1]^T, v3 = [1, 1, 1]^T
            // Let's verify eigenvalues:
            // For lambda = l1: eigenvector v_l1 is [1, 0, 1]^T or multiples
            // For lambda = l2: eigenvector v_l2 is [0, 1, 1]^T or multiples
            // For lambda = l3: eigenvector v_l3 is [1, 1, 1]^T or multiples

            return {
                text: "Dada la siguiente matriz $A$, determina:<br>&nbsp;&nbsp;&nbsp;&nbsp;a) El polinomio característico $p(\\lambda)$.<br>&nbsp;&nbsp;&nbsp;&nbsp;b) Los valores propios $\\lambda_i$.<br>&nbsp;&nbsp;&nbsp;&nbsp;c) Los vectores propios asociados a cada valor propio.",
                latex: "\\[ " + formatMatrixMathJax(A, "A") + " \\]",
                answer: `Polinomio: $p(\\lambda) = ${polyStr} = 0$, Valores propios: $\\lambda_1 = ${l1}$, $\\lambda_2 = ${l2}$, $\\lambda_3 = ${l3}$. Vectores propios correspondientes: $v_1 = \\begin{bmatrix} 1 \\\\ 0 \\\\ 1 \\end{bmatrix}$, $v_2 = \\begin{bmatrix} 0 \\\\ 1 \\\\ 1 \\end{bmatrix}$, $v_3 = \\begin{bmatrix} 1 \\\\ 1 \\\\ 1 \\end{bmatrix}$`
            };
        }

        // Ficha 9: SVD (2x2)
        function getSVDProblem() {
            // A simple 2x2 matrix with integer singular values
            // Let's use A = [[3, 0], [4, 5]]
            // A^T A = [[25, 20], [20, 25]]
            // eigenvalues of A^T A: (25-lambda)^2 - 400 = 0 -> 25-lambda = +-20 -> lambda1 = 45, lambda2 = 5
            // Singular values: s1 = sqrt(45) = 3*sqrt(5), s2 = sqrt(5)
            // Let's use simpler one if possible, like A = [[2, 2], [-1, 1]]
            // A^T A = [[5, 3], [3, 5]] -> lambda = 8, 2
            // Singular values: s1 = sqrt(8) = 2*sqrt(2), s2 = sqrt(2)
            
            // Let's generate one of these predefined nice cases:
            let cases = [
                {
                    A: [[3, 0], [0, 2]],
                    U: [[1, 0], [0, 1]],
                    S: [[3, 0], [0, 2]],
                    V: [[1, 0], [0, 1]]
                },
                {
                    A: [[1, 2], [2, 1]],
                    U: [[1/Math.sqrt(2), 1/Math.sqrt(2)], [1/Math.sqrt(2), -1/Math.sqrt(2)]],
                    S: [[3, 0], [0, 1]],
                    V: [[1/Math.sqrt(2), -1/Math.sqrt(2)], [1/Math.sqrt(2), 1/Math.sqrt(2)]]
                },
                {
                    A: [[2, 2], [-1, 1]],
                    U: [[1, 0], [0, 1]], // simplified or decimal representation
                    S: [[2.828, 0], [0, 1.414]],
                    V: [[0.707, -0.707], [0.707, 0.707]]
                }
            ];

            let choice = cases[Math.floor(Math.random() * cases.length)];

            return {
                text: "Encuentra la Descomposición en Valores Singulares ($A = U S V^T$) para la siguiente matriz de $2 \\times 2$ $A$, determinando su matriz de covarianza $A^T A$, valores singulares y las matrices $U, S, V^T$.",
                latex: "\\[ " + formatMatrixMathJax(choice.A, "A") + " \\]",
                answer: `Valores singulares: $\\sigma_1 \\approx ${choice.S[0][0]}, \\sigma_2 \\approx ${choice.S[1][1]}$. Matrices: $S = \\begin{bmatrix} ${choice.S[0][0]} & 0 \\\\ 0 & ${choice.S[1][1]} \\end{bmatrix}$, $U \\approx \\begin{bmatrix} ${choice.U[0][0].toFixed(3)} & ${choice.U[0][1].toFixed(3)} \\\\ ${choice.U[1][0].toFixed(3)} & ${choice.U[1][1].toFixed(3)} \\end{bmatrix}$, $V^T \\approx \\begin{bmatrix} ${choice.V[0][0].toFixed(3)} & ${choice.V[1][0].toFixed(3)} \\\\ ${choice.V[0][1].toFixed(3)} & ${choice.V[1][1].toFixed(3)} \\end{bmatrix}$`
            };
        }

        // Ficha 10: Matrices de Rotación (2D)
        function getRotationProblem() {
            let figures = [
                { name: "Triángulo", pts: [[1, 1], [3, 1], [2, 3]] },
                { name: "Cuadrado", pts: [[1, 1], [2, 1], [2, 2], [1, 2]] }
            ];
            let fig = figures[Math.floor(Math.random() * figures.length)];
            let angles = [90, 180, 270];
            let angle = angles[Math.floor(Math.random() * angles.length)];

            // Calculations
            let rad = angle * Math.PI / 180;
            let cos = Math.round(Math.cos(rad));
            let sin = Math.round(Math.sin(rad));

            let transformed = fig.pts.map(p => {
                // R = [[cos, -sin], [sin, cos]]
                let x = cos * p[0] - sin * p[1];
                let y = sin * p[0] + cos * p[1];
                return [x, y];
            });

            let ptsStr = fig.pts.map((p, i) => `P_{${i+1}}(${p[0]}, ${p[1]})`).join(", ");
            let transStr = transformed.map((p, i) => `P'_{${i+1}}(${p[0]}, ${p[1]})`).join(", ");

            return {
                text: `Dada la figura geométrica $F$ en 2D con vértices: $\\{ ${ptsStr} \\}$. Aplica una rotación de $\\theta = ${angle}^\\circ$ en sentido antihorario respecto al origen y obtén las nuevas coordenadas de los vértices transformados.`,
                latex: "",
                answer: `Matriz R: $\\begin{bmatrix} ${cos} & ${-sin} \\\\ ${sin} & ${cos} \\end{bmatrix}$. Nuevos vértices: $\\{ ${transStr} \\}$`
            };
        }

        // --- Exam Generator Logic ---

        function generateExams() {
            const countInput = document.getElementById('examCount');

            for (let examIndex = 1; examIndex <= numExams; examIndex++) {
                const examCode = "AL2-" + examIndex;
                const sheet = document.createElement('div');
                sheet.className = 'exam-sheet';

                // Questions & Solver
                const p1 = getGramSchmidtProblem();
                const p2 = getChangeOfBasisProblem();
                const p3 = getEigenvaluesProblem();
                const p4 = getSVDProblem();
                const p5 = getRotationProblem();

                // Header
                let html = `
                    <div class="exam-header">
                        <img src="http://www.uadec.mx/wp-content/uploads/2019/01/EscudoUAdeC-C.png" alt="Escudo UAdeC">

                    </div>
                    <div class="exam-body">
                        <h2>Examen Parcial de Álgebra Lineal - Parte 2 <span class="exam-code">Clave: ${examCode}</span></h2>
                        <div class="instructions">
                            <strong>Instrucciones:</strong> Resuelve cada uno de los siguientes problemas detallando todo el procedimiento a mano en tu hoja de respuestas.
                        </div>
                        <ul class="questions-list">
                `;

                html += `
                            <li class="question-item">
                                <div class="question-text">${p1.text}</div>
                                <div class="matrix-display-container">${p1.latex}</div>
                            </li>
                            <li class="question-item">
                                <div class="question-text">${p2.text}</div>
                                <div class="matrix-display-container">${p2.latex}</div>
                            </li>
                            <li class="question-item">
                                <div class="question-text">${p3.text}</div>
                                <div class="matrix-display-container">${p3.latex}</div>
                            </li>
                            <li class="question-item">
                                <div class="question-text">${p4.text}</div>
                                <div class="matrix-display-container">${p4.latex}</div>
                            </li>
                            <li class="question-item">
                                <div class="question-text">${p5.text}</div>
                                <div class="matrix-display-container">${p5.latex ? p5.latex : ""}</div>
                            </li>
                `;

                html += `
                        </ul>
                    </div>
                `;

                sheet.innerHTML = html;
                container.appendChild(sheet);

                // Add to answer sheet
                answerSheetHtml += `
                    <div class="exam-answer-block">
                        <h3>Examen Clave: ${examCode}</h3>
                        <div class="answer-item"><strong>1. Gram-Schmidt:</strong> ${p1.answer}</div>
                        <div class="answer-item"><strong>2. Cambio de Base:</strong> ${p2.answer}</div>
                        <div class="answer-item"><strong>3. Valores/Vectores Propios:</strong> ${p3.answer}</div>
                        <div class="answer-item"><strong>4. SVD:</strong> ${p4.answer}</div>
                        <div class="answer-item"><strong>5. Rotaciones 2D:</strong> ${p5.answer}</div>
                    </div>
                `;
            }

            answerSheetHtml += `</div>`;

            // Append answers sheet to container
            container.innerHTML += answerSheetHtml;

            // Typeset MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        function printPDF() {
            window.print();
        }
    </script>
